repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: .venv/bin/python -m ruff check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest
        language: system
        pass_filenames: false
        always_run: true
